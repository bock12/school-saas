name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: school-saas

jobs:
  validate:
    name: Typecheck, security tests, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: school-saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Security tests
        run: npm test

      - name: Dependency audit (production dependencies)
        # braces@3.0.3 is currently pulled only through the dev-only
        # eslint-config-next toolchain. The upstream project has no patched
        # release for CVE-2026-93687 yet, so the production security gate
        # excludes devDependencies rather than forcing an incompatible
        # eslint-config-next downgrade. Revisit when an upstream fix ships.
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  lint:
    name: Lint baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: school-saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
